name: Pipeline de Build e Testes

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-security:
    name: Segurança (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
        working-directory: ./frontend
      - name: npm audit
        run: |
          echo "### Resultado do NPM Audit" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          npm audit >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: ./frontend
        continue-on-error: true

  frontend-lint:
    name: Análise Estática (Frontend)
    needs: frontend-security 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
        working-directory: ./frontend
        
      - name: ESLint (Com Reviewdog)
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          workdir: ./frontend
          eslint_flags: 'src/'

  frontend-build:
    name: Build (Frontend)
    needs: frontend-lint 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend
        env:
          CI: false
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_URL: ${{ vars.REACT_APP_URL }}
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ vars.REACT_APP_CLOUDINARY_CLOUD_NAME }}
          CYPRESS_testUser: '{"name": "${{secrets.NAME}}","email": "${{secrets.EMAIL}}","password": "${{secrets.PASSWORD}}"}'
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/ 

  backend-security:
    name: Segurança (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - run: chmod +x mvnw
        working-directory: ./backend
      - name: OWASP Dependency-Check (Via Maven)
        run: ./mvnw org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        working-directory: ./backend
        continue-on-error: true
      - name: Disponibilizar Relatório OWASP
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-seguranca-owasp
          path: backend/target/dependency-check-report.html
  backend-analysis:
    name: Análise Estática (Backend)
    needs: backend-security 
    runs-on: ubuntu-latest
    permissions:
      contents: read     
      checks: write    
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - run: chmod +x mvnw
        working-directory: ./backend
      - name: SpotBugs
        run: ./mvnw compile spotbugs:spotbugs -Dspotbugs.xmlOutput=true
        working-directory: ./backend
        continue-on-error: true 
      - name: SpotBugs Summary
        uses: jwgmeligmeyling/spotbugs-github-action@master
        with:
          path: 'backend/target/spotbugsXml.xml'
  backend-build:
    name: Build (Backend)
    needs: backend-analysis 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - run: chmod +x mvnw
        working-directory: ./backend
      - run: ./mvnw clean package -DskipTests
        working-directory: ./backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  testes-cypress:
    name: Testes E2E (Cypress)
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meubanco_teste
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      
      - uses: actions/download-artifact@v4
        with: { name: frontend-build, path: frontend/build/ }
      - uses: actions/download-artifact@v4
        with: { name: backend-jar, path: backend/target/ }
        
      - run: npm ci
        working-directory: ./frontend
        
      - name: Iniciar Serviços (Backend, DB, Frontend)
        run: |
          java -jar ../backend/target/*.jar &
          sleep 20
          
          mysql -h 127.0.0.1 -P 3306 -u root -proot meubanco_teste < ../.github/scripts/seed.sql

          npx --yes serve -s build -p 3000 &
          sleep 10
        working-directory: ./frontend
        env:
          JWT_SECRET: ${{ vars.JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/meubanco_teste
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/meubanco_mongo_teste
          REACT_APP_API_URL: http://localhost:8080/
          REACT_APP_URL: http://localhost:3000/
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ vars.REACT_APP_CLOUDINARY_CLOUD_NAME }}

      - name: Executar Testes Cypress (Com Sumário Automático)
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: ./frontend
        env:
          JWT_SECRET: ${{ vars.JWT_SECRET }}
          REACT_APP_API_URL: http://localhost:8080/
          REACT_APP_URL: http://localhost:3000/
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ vars.REACT_APP_CLOUDINARY_CLOUD_NAME }}
          CYPRESS_testUser: '{"name": "${{secrets.NAME}}","email": "${{secrets.EMAIL}}","password": "${{secrets.PASSWORD}}"}'